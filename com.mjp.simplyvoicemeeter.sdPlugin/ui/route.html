<!DOCTYPE html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>Simply Voicemeeter</title>
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  <link rel="stylesheet" href="common.css" />
  <script src="common.js"></script>
</head>
<body>
  <div id="status"></div>
  <hr />
  <sdpi-item label="Strip">
    <sdpi-select setting="strip" datasource="getStrips" loading="Reading Voicemeeter…" show-refresh placeholder="Choose a strip"></sdpi-select>
  </sdpi-item>
  <sdpi-item label="Bus">
    <sdpi-select setting="bus" datasource="getBusNames" loading="Reading Voicemeeter…" show-refresh placeholder="Choose a bus"></sdpi-select>
  </sdpi-item>
  <div class="sd-help">Toggles the strip's A1 / A2 / B1 … button in Voicemeeter.</div>
</body>
</html>

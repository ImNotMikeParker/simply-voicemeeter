<!DOCTYPE html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>Simply Voicemeeter</title>
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  <link rel="stylesheet" href="common.css" />
  <script src="common.js"></script>
</head>
<body>
  <div id="status"></div>
  <hr />
  <sdpi-item label="Preset number">
    <sdpi-textfield setting="preset" placeholder="1"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Or load config file">
    <sdpi-textfield setting="file" placeholder="C:\\path\\to\\config.xml"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Label">
    <sdpi-textfield setting="label" placeholder="Shown on the key"></sdpi-textfield>
  </sdpi-item>
  <div class="sd-help">Preset scenes are the numbered slots in Voicemeeter's menu. A config file path takes precedence when set.</div>
</body>
</html>
